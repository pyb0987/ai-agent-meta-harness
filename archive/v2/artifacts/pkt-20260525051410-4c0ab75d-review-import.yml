        rejects custom stable commands.
      validation_layer: derived-verdict
      probe_run: true
      probe_command: python3 -m unittest tests.test_governance_acceptance_cli.GovernanceAcceptanceCliTests.test_capture_search_set_writes_resolvable_phase_trace
