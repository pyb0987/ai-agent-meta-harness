      attack_surface: A no-op or custom capture command could masquerade as stable
        search-set evidence.
      primary_failure_mode: Search-set evidence points to diagnostic command output
        rather than canonical capture metadata.
      frame_challenge: false
      required: true
      actor: codex
      date: '2026-05-25'
      score: 9
      verdict: pass
      veto: false
      blocking_findings: []
      false_green_risk: Search-set refs could satisfy stable review without command/head/packet
