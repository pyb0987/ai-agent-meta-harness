      name: Checker Correctness Critic
      critic_type: validation_layer
      persona: Validator maintainer checking draft verdict semantics.
      scope: Confirm draft MultiReviewResult artifacts no longer present as reported
        PASS and the validator enforces draft verdicts.
      anti_scope: Does not certify future semantic agent-in-loop scoring.
      attack_surface: Draft templates could look like final PASS evidence to a human
        reviewer.
      primary_failure_mode: A draft lifecycle artifact reports PASS and is mistaken
        for final governance approval.
      frame_challenge: false
      required: true
      actor: codex
      date: '2026-05-18'
      score: 9
      verdict: pass
      veto: false
      blocking_findings: []
      false_green_risk: Draft review skeletons could otherwise visually imply PASS
        before completion.
      invariant_checked: Draft lifecycle artifacts must use a draft verdict rather
        than PASS.
      validation_layer: structured-validator
      probe_run: true
      probe_command: python3 -c 'import sys, unittest; names=['"'"'tests.test_multi_review_result_cli.MultiReviewResultCliTests.test_draft_reported_verdict_must_be_incomplete_not_pass'"'"'];
        suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromNames(names));
        result=unittest.TestResult(); suite.run(result); print('"'"'tests='"'"' +
        '"'"','"'"'.join(names)); print(f'"'"'tests_run={result.testsRun}'"'"'); print(f'"'"'failures={len(result.failures)}'"'"');
        print(f'"'"'errors={len(result.errors)}'"'"'); print(f'"'"'skipped={len(result.skipped)}'"'"');
        sys.exit(0 if result.wasSuccessful() else 1)'
      probe_exit_code: 0
      probe_result: Focused validator test accepts draft INCOMPLETE reporting and
        rejects draft PASS reporting.
      probe_interpretation: The deterministic test output binds the new human-facing
        draft rule to validator behavior.
      probe_evidence_refs:
      - file:archive/v2/artifacts/pkt-20260518182410-98ffba97-checker-correctness-probe.yml
      reason_no_probe: null
      evidence:
