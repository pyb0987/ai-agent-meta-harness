    score: 9
    veto: false
    actor: reviewer
    role: reviewer
    date: 2026-05-06
    source_ref: file:backlog/fixtures/acceptance-packets/artifacts/harness-affecting-review-import.yml
    false_green_risk: A hand-authored packet could claim checker correctness while
      omitting boundary evidence.
    invariant_checked: Required evidence and review obligations are recomputed by
      the checker.
    evidence:
    - Release-gate commands and artifacts are represented in packet evidence.
    source_refs:
