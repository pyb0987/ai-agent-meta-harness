AcceptancePacketReviewImport:
  schema_version: acceptance-packet-review-import/v1
  target_binding:
    packet_id: pkt-finalized-harness-affecting-example
    packet_ref: backlog/fixtures/acceptance-packets/finalized-harness-affecting.yml
    review_target_digest: fb14109a70f79846d64198cf77d0fcf283a6c401ee870982ec5fff2d29175694
    baseline_ref: origin/main
    comparison_ref: origin/main
    source_refs:
    - scripts/check-v1-archive-boundary.py
    - scripts/verify-release.py
    changed_paths:
    - scripts/check-v1-archive-boundary.py
    - scripts/verify-release.py
    required_review:
    - checker correctness
    - evaluator boundary
    - methodology fidelity
    - release integration
  MultiReviewResult:
    schema_version: multi-review-result/v1
    review_id: mr-pkt-finalized-harness-affecting-example
    lifecycle: finalized
    review_mode: governance
    independence: independent
    target:
      summary: AcceptancePacket review import for the harness-affecting fixture.
      source_refs:
      - backlog/fixtures/acceptance-packets/finalized-harness-affecting.yml
      - scripts/check-governance-acceptance.py
    required_critics:
    - validation-layer
    - review-quality
    - scope-c-contract
    reported_final_verdict: PASS
    derived_verdict: null
    derivation_errors: []
    critics:
    - critic_id: validation-layer
      name: Validation Layer Critic
      critic_type: validation_layer
      persona: Release gate engineer who trusts durable transcript evidence and read-only
        validation.
      scope: Confirm review closure is computed from wrapper lineage.
      anti_scope: Does not evaluate archive storage or immutable packet hashes.
      attack_surface: Stable packet import could trust marker-only or target-agnostic
        review evidence.
      primary_failure_mode: Review import accepts stale or unbound probe transcripts
        as governance PASS.
      frame_challenge: false
      required: true
      actor: codex
      date: 2026-05-06
      score: 9
      verdict: pass
      veto: false
      blocking_findings: []
      false_green_risk: Packet-local review summaries could omit imported failed lineage.
      invariant_checked: The checker mirrors wrapper review_lineage into packet reviews.
      validation_layer: structured-validator
      probe_run: true
      probe_command: python3 -c "import sys, unittest; names=['tests.test_governance_review_import.GovernanceReviewImportTests.test_accepts_target_bound_review_import_fixture'];
        suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromNames(names));
        result=unittest.TestResult(); suite.run(result); print('tests=' + ','.join(names));
        print(f'tests_run={result.testsRun}'); print(f'failures={len(result.failures)}');
        print(f'errors={len(result.errors)}'); print(f'skipped={len(result.skipped)}');
        sys.exit(0 if result.wasSuccessful() else 1)"
      probe_exit_code: 0
      probe_result: Stable checker derives review closure from structured wrapper
        lineage, with replayable deterministic unittest result output.
      probe_interpretation: The transcript records the exact focused unittest outcome
        observed by the wrapper command.
      probe_evidence_refs:
      - file:backlog/fixtures/acceptance-packets/artifacts/review-import-validation-layer-probe.txt
      reason_no_probe: null
      evidence:
      - Wrapper lineage is required for stable review closure.
      - review_lineage_sha256:f7356afcf812685187a4c1b3c2836be0f9835447e0dba6f487ec129849fb7f3a
      source_refs:
      - scripts/check-governance-acceptance.py
      - tests/test_governance_review_import.py
      why_not_10: Fixture is illustrative and does not represent an archived packet.
      residual_risk_disposition: Accepted for local fixture validation only.
    - critic_id: review-quality
      name: Review Quality Meta-Critic
      critic_type: review_quality
      persona: Audit reviewer checking replayable review provenance.
      scope: Confirm imported review artifacts remain independently checkable.
      anti_scope: Does not decide archive immutability or release hook wiring.
      attack_surface: A stale PASS synthesis could be replayed against another packet.
      primary_failure_mode: Target binding or review provenance drifts while review
        still claims PASS.
      frame_challenge: true
      required: true
      actor: codex
      date: 2026-05-06
      score: 9
      verdict: pass
      veto: false
      blocking_findings: []
      false_green_risk: A stale PASS synthesis could be replayed against another packet.
      invariant_checked: Target binding includes packet id, refs, changed paths, and
        digest.
      validation_layer: derived-verdict
      probe_run: true
      probe_command: python3 -c "import sys, unittest; names=['tests.test_governance_review_import.GovernanceReviewImportTests.test_review_target_digest_is_order_insensitive_but_target_sensitive',
        'tests.test_governance_review_import.GovernanceReviewImportTests.test_rejects_wrong_packet_or_stale_target_binding'];
        suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromNames(names));
        result=unittest.TestResult(); suite.run(result); print('tests=' + ','.join(names));
        print(f'tests_run={result.testsRun}'); print(f'failures={len(result.failures)}');
        print(f'errors={len(result.errors)}'); print(f'skipped={len(result.skipped)}');
        sys.exit(0 if result.wasSuccessful() else 1)"
      probe_exit_code: 0
      probe_result: Governance review import tests reject stale target binding and
        target digest drift, with replayable deterministic unittest result output.
      probe_interpretation: The transcript records the exact focused unittest outcome
        observed by the wrapper command.
      probe_evidence_refs:
      - file:backlog/fixtures/acceptance-packets/artifacts/review-import-review-quality-probe.txt
      reason_no_probe: null
      evidence:
      - The wrapper carries a non-self-referential target binding.
      source_refs:
      - tests/test_governance_review_import.py
      why_not_10: Scope C does not prove conversation-history completeness.
      residual_risk_disposition: Accepted because wrapper completeness is the Scope
        C boundary.
    - critic_id: scope-c-contract
      name: Structured Contract Critic
      critic_type: domain
      persona: Schema maintainer preserving the Scope B result contract.
      scope: Confirm Scope C keeps Scope B schema intact.
      anti_scope: Does not evaluate command replay beyond the nested MultiReviewResult
        contract.
      attack_surface: Target binding could be embedded into MultiReviewResult and
        weaken schema separation.
      primary_failure_mode: Packet binding fields leak into the nested review-result
        schema.
      frame_challenge: false
      required: true
      actor: codex
      date: 2026-05-06
      score: 9
      verdict: pass
      veto: false
      blocking_findings: []
      false_green_risk: Target binding could be added to MultiReviewResult and weaken
        its schema.
      invariant_checked: Target binding lives in the AcceptancePacketReviewImport
        wrapper.
      validation_layer: raw-artifact
      probe_run: true
      probe_command: python3 -c "import sys, unittest; names=['tests.test_governance_review_import.GovernanceReviewImportTests.test_rejects_advisory_multi_review_import'];
        suite=unittest.TestSuite(unittest.defaultTestLoader.loadTestsFromNames(names));
        result=unittest.TestResult(); suite.run(result); print('tests=' + ','.join(names));
        print(f'tests_run={result.testsRun}'); print(f'failures={len(result.failures)}');
        print(f'errors={len(result.errors)}'); print(f'skipped={len(result.skipped)}');
        sys.exit(0 if result.wasSuccessful() else 1)"
      probe_exit_code: 0
      probe_result: Wrapper rejects advisory nested MultiReviewResult imports while
        keeping target binding outside the nested result.
      probe_interpretation: Scope C owns packet binding while Scope B owns governance-mode
        synthesis consistency.
      probe_evidence_refs:
      - file:backlog/fixtures/acceptance-packets/artifacts/review-import-scope-contract-probe.txt
      reason_no_probe: null
      evidence:
      - Nested MultiReviewResult keeps its v1 field set.
      source_refs:
      - backlog/fixtures/acceptance-packets/artifacts/harness-affecting-review-import.yml
      - tests/test_governance_review_import.py
      why_not_10: The fixture does not include failed review lineage.
      residual_risk_disposition: Failed lineage is covered by negative tests.
  review_lineage:
  - review_id: review-harness-checker-correctness
    critic: checker correctness
    scope: Release-gate checker behavior and stable evidence boundaries.
    anti_scope: Archive storage, immutable packet hashes, and release integration
