    rerun_of: null
    fixed_finding_ids: []
  - review_id: review-harness-release-integration
    critic: release integration
    scope: Release command wiring and archive-boundary command coverage.
    anti_scope: Pre-commit replacement and packet archive publication.
    score: 9
