    false_green_risk: Release integration could point to unrelated command artifacts.
    invariant_checked: Stable command artifacts record packet id, packet ref, digest,
      command, and status.
    evidence:
    - Release integration command artifacts are durable local files.
    source_refs:
    - scripts/verify-release.py
    - scripts/check-v1-archive-boundary.py
    blocking_findings: []
    why_not_10: Current fixture is illustrative and not an executable packet.
    disposition: Covered by checker validation for local fixture semantics.
    rerun_of: null
    fixed_finding_ids: []
  - review_id: review-harness-methodology-fidelity
    critic: methodology fidelity
    scope: Methodology boundary for v1 archive compatibility examples.
    anti_scope: New archive storage or immutable transcript indexing.
    score: 9
    veto: false
    actor: reviewer
    role: reviewer
    date: 2026-05-06
