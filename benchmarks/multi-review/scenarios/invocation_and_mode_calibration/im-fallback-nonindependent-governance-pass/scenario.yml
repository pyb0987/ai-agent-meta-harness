  title: Non-independent fallback accepted as governance
  summary: Fallback non-independent review must not derive governance PASS.
  input_artifacts:
    - backlog/fixtures/multi-review/governance-pass.yml
base_result: backlog/fixtures/multi-review/governance-pass.yml
mutations:
