    path: /independence
    value: fallback_nonindependent
verify_probe_commands: false
sealed_oracle:
  oracle_type: structural
  scoring_mode: validator-only
  expected_derived_verdict: FALLBACK_NONINDEPENDENT
  expected_errors:
    - "fallback_nonindependent cannot derive governance PASS"
  false_green_target: Non-independent fallback output is promoted to governance PASS.
  primary_invariant: Governance PASS requires independent review.
  oracle_assertions:
    - id: im-001
      kind: fallback_nonindependent_acceptance
      severity: blocking
      target_path: /independence
      invariant_id: governance_requires_independence
      required_evidence_refs:
        - backlog/fixtures/multi-review/governance-pass.yml
      forbidden_shortcuts:
        - fallback result says pass
      acceptable_disposition:
        - FALLBACK_NONINDEPENDENT
