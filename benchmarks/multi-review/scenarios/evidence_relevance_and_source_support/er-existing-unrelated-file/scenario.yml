schema_version: multi-review-benchmark-scenario/v1
scenario_id: er-existing-unrelated-file
axis: evidence_relevance_and_source_support
review_mode: governance
public_input:
  neutral_id: case-009
  title: Existing but unbound evidence file
  summary: Critic source refs must stay bound to the linked probe transcript source refs.
  input_artifacts:
    - backlog/fixtures/multi-review/governance-pass.yml
base_result: backlog/fixtures/multi-review/governance-pass.yml
mutations:
  - op: set
    path: /critics/2/source_refs
    value:
      - README.md
replay_probe_commands: false
sealed_oracle:
  oracle_type: structural
  scoring_mode: validator-only
  expected_derived_verdict: VETO
  expected_errors:
    - "probe_evidence_refs must include a structured transcript matching probe_command and probe_exit_code"
  false_green_target: Existing repository-local refs are substituted without matching transcript binding.
  primary_invariant: Critic source refs must match the structured transcript source refs for the probe evidence.
  oracle_assertions:
    - id: er-001
      kind: evidence_source_binding_contract
      severity: blocking
      target_path: /critics/*/source_refs
      invariant_id: critic_source_refs_match_probe_transcript_source_refs
      required_evidence_refs:
        - file:backlog/fixtures/multi-review/probe-transcripts/governance-pass-schema-contract.txt
      forbidden_shortcuts:
        - file merely exists
      acceptable_disposition:
        - VETO
